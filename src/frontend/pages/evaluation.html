<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Évaluation ponctuelle des connaissances en soins infirmiers">
    <title>IFSI Lannion - S'évaluer</title>
    <link rel="manifest" href="../../../public/manifest.json">
    <link rel="icon" type="image/png" href="../../../public/images/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/styles/theme.css">
    <link rel="stylesheet" href="../assets/styles/design-system.css">
    <link rel="stylesheet" href="../assets/styles/animations.css">
    <link rel="stylesheet" href="../assets/styles/layout.css">
    <style>
        html, body { min-height: 100%; }
        body { display: flex; flex-direction: column; background: var(--color-bg-light); }
        main { flex: 1; }
        .app-header { background: var(--color-bg); border-bottom: 1px solid var(--color-border); }
        .header-content { display: flex; justify-content: space-between; align-items: center; max-width: 1280px; margin: auto; padding: var(--space-4); }
        .header-brand { display: flex; align-items: center; gap: var(--space-2); color: var(--color-text-dark); text-decoration: none; }
        .header-brand-icon { font-size: 1.5rem; }
        .header-brand-text h1, .header-brand-text p { margin: 0; }
        .header-brand-text h1 { color: var(--color-primary); font-size: var(--font-size-base); }
        .header-brand-text p { color: var(--color-text-muted); font-size: var(--font-size-xs); }
        .page-container { max-width: 900px; margin: auto; padding: var(--space-6) var(--space-4); }
        .hero { background: var(--gradient-primary); color: white; padding: var(--space-8) var(--space-4); text-align: center; }
        .hero h2 { color: white; margin: 0 0 var(--space-2); }
        .hero p { margin: 0; color: rgba(255,255,255,.9); }
        .panel { background: var(--color-bg); border-radius: var(--radius-xl); padding: var(--space-6); box-shadow: var(--shadow-md); }
        .panel h3 { margin-top: 0; }
        .ue-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: var(--space-2); max-height: 360px; overflow-y: auto; margin: var(--space-4) 0; }
        .ue-option { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-md); cursor: pointer; }
        .ue-option:has(input:checked) { border-color: var(--color-primary); background: var(--color-primary-lighter); }
        .ue-option small { margin-left: auto; color: var(--color-text-muted); }
        .question-options { display: flex; gap: var(--space-3); flex-wrap: wrap; margin: var(--space-4) 0; }
        .question-option { flex: 1; min-width: 120px; padding: var(--space-3); border: 2px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); cursor: pointer; font-weight: 600; }
        .question-option.selected { border-color: var(--color-primary); background: var(--color-primary-lighter); color: var(--color-primary-dark); }
        .primary-button { width: 100%; padding: var(--space-4); border: 0; border-radius: var(--radius-lg); background: var(--gradient-primary); color: white; font-weight: 700; cursor: pointer; }
        .primary-button:disabled { opacity: .5; cursor: not-allowed; }
        .primary-button.answer-correct { background: var(--color-success); opacity: 1; }
        .primary-button.answer-incorrect { background: var(--color-danger); opacity: 1; }
        .question-card { max-width: 760px; margin: auto; }
        .question-meta { display: flex; justify-content: space-between; color: var(--color-text-muted); font-size: var(--font-size-sm); margin-bottom: var(--space-4); }
        .question-term { font-size: var(--font-size-2xl); color: var(--color-text-dark); margin: var(--space-6) 0; }
        .answer-list { display: grid; gap: var(--space-3); }
        .answer-button { text-align: left; padding: var(--space-4); border: 2px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); cursor: pointer; line-height: 1.5; }
        .answer-button:hover, .answer-button:focus { border-color: var(--color-primary); }
        .answer-button.selected { border-color: var(--color-primary); background: var(--color-primary-lighter); }
        .results-score { text-align: center; font-size: 3rem; font-weight: 700; color: var(--color-primary); margin: var(--space-4) 0; }
        .result-item { padding: var(--space-3); border-left: 4px solid var(--color-danger); background: var(--color-bg-light); margin-top: var(--space-2); }
        .result-item.correct { border-color: var(--color-success); }
        .hidden { display: none !important; }
        .app-footer { text-align: center; color: var(--color-text-muted); padding: var(--space-6); font-size: var(--font-size-xs); }
        @media (min-width: 641px) { .header-content, .page-container { padding-left: var(--space-6); padding-right: var(--space-6); } }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <a href="./home.html" class="header-brand">
                <span class="header-brand-icon">📚</span>
                <div class="header-brand-text"><h1>IFSI Lannion</h1><p>Promo 2025-2028</p></div>
            </a>
        </div>
    </header>
    <main>
        <section class="hero"><h2>📝 S'évaluer</h2><p>Mesurez ponctuellement vos connaissances sur les UE sélectionnées.</p></section>
        <div class="page-container">
            <section id="setupPanel" class="panel">
                <h3>Choisissez vos UE</h3>
                <p id="availabilityMessage">Chargement des termes disponibles…</p>
                <div id="ueList" class="ue-list"></div>
                <h3>Nombre de questions</h3>
                <div class="question-options" role="group" aria-label="Nombre de questions">
                    <button type="button" class="question-option" data-count="10">10 questions</button>
                    <button type="button" class="question-option" data-count="20">20 questions</button>
                </div>
                <p id="questionHint"></p>
                <button id="startButton" class="primary-button" type="button" disabled>Commencer l'évaluation</button>
            </section>
            <section id="quizPanel" class="panel question-card hidden" aria-live="polite">
                <div class="question-meta"><span id="questionProgress"></span><span id="questionScore"></span></div>
                <p id="questionUE" class="question-meta"></p>
                <h3 id="questionTerm" class="question-term"></h3>
                <div id="answerList" class="answer-list"></div>
                <button id="nextButton" class="primary-button" type="button" disabled>Valider ma réponse</button>
            </section>
            <section id="resultsPanel" class="panel hidden" aria-live="polite">
                <h3>Résultat de votre évaluation</h3>
                <div id="resultsScore" class="results-score"></div>
                <p id="resultsSummary"></p>
                <div id="resultsDetails"></div>
                <button id="restartButton" class="primary-button" type="button">Nouvelle évaluation</button>
            </section>
        </div>
    </main>
    <footer class="app-footer">IFSI Lannion 2025 - Plateforme v3.0</footer>
    <script src="../assets/scripts/modules/evaluation.js"></script>
</body>
</html>
